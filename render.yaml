# One-click deploy on Render: New → Blueprint → pick this repo.
# The free plan sleeps after ~15 idle minutes and takes about a minute to wake;
# open the site once before a demo so it's warm.
services:
  - type: web
    name: shikshak
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BOLNA_API_KEY
        sync: false
      # Not secret: useless without BOLNA_API_KEY, which stays in Render's dashboard.
      - key: BOLNA_AGENT_ID
        value: "7438fadd-ad12-411c-9e31-fb9ad976ecbd"
      - key: PUBLIC_URL
        value: "https://shikshak-o0l8.onrender.com"
      - key: TOOLS_TOKEN
        sync: false
      # Set to 1 until GEMINI_API_KEY is filled in, then delete it.
      - key: FAKE_CHECKER
        sync: false
