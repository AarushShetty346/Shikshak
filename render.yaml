# One-click deploy on Render: New → Blueprint → pick this repo.
# The free plan sleeps after ~15 idle minutes and takes about a minute to wake;
# open the site once before a demo so it's warm.
services:
  - type: web
    name: shikshak
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BOLNA_API_KEY
        sync: false
      # Not secret: useless without BOLNA_API_KEY, which stays in Render's dashboard.
      - key: BOLNA_AGENT_ID
        value: "7438fadd-ad12-411c-9e31-fb9ad976ecbd"
      - key: PUBLIC_URL
        value: "https://shikshak-o0l8.onrender.com"
      # Required in production (see docs/DEPLOYMENT.md): the same value the agents were set up with.
      - key: TOOLS_TOKEN
        sync: false
      # Operator endpoints (phone revision). Leave empty to keep them off.
      - key: ADMIN_TOKEN
        sync: false
      # Languages the agent has (bolna:setup pushed Tamil and Telugu on 31 Oct 2026).
      - key: BOLNA_AGENT_LANGUAGES
        value: "hi,en,ta,te"
      # The free plan has no persistent disk: data is lost on each deploy. See docs/DEPLOYMENT.md.
      - key: DATA_DIR
        value: "data"
      # Set to 1 until GEMINI_API_KEY is filled in, then delete it.
      - key: FAKE_CHECKER
        sync: false
